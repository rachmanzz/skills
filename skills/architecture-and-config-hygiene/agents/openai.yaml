interface:
  display_name: "Architecture and Config Hygiene"
  short_description: "Audit dependency coupling, cycles, abstractions, dead code, duplication, and config"
  default_prompt: "Use $architecture-and-config-hygiene to audit this codebase for package/module coupling, circular dependencies, over/mis-applied abstractions, dead code, logic duplication, and missing, invalid, or unsafe default configuration."
policy:
  allow_implicit_invocation: true
