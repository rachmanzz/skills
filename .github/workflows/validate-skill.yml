name: Validate skill

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Validate all skill packages
        run: |
          set -uo pipefail
          failed=0
          for skill_dir in skills/*/; do
            python3 -B skills/performance-and-resource-efficiency/scripts/validate-skill-package.py "$skill_dir" || failed=1
          done
          exit "$failed"

      - name: Validate evidence ledger
        run: python3 -B skills/performance-and-resource-efficiency/scripts/validate-evidence.py skills/performance-and-resource-efficiency/references/evidence-ledger-template.md

      - name: Validate package and plugin metadata
        run: |
          python3 -B -c "import json; p = json.load(open('package.json', encoding='utf-8')); assert isinstance(p, dict) and p.get('name') and p.get('version') and p.get('license') and 'skills' in p.get('files', [])"
          python3 -B -c "import json; p = json.load(open('plugin.json', encoding='utf-8')); assert isinstance(p, dict) and p.get('name') and p.get('version') and p.get('description')"

      - name: Run validator unit tests
        run: python3 -B -m unittest discover -s tests -v
